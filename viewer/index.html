<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kartograph</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <div><h1 id="title">Kartograph</h1><div class="stats" id="stats"></div></div>
    <div class="header-right">
      <div class="stats" id="maturity"></div>
      <button type="button" id="reset" class="reset">Reset layout</button>
    </div>
  </header>
  <div id="main">
    <div id="canvas"><div id="world"><svg class="edges" id="edges"></svg></div></div>
    <aside id="sidebar">
      <button type="button" id="sidebarToggle" class="sidebar-toggle" title="Collapse panel" aria-label="Collapse panel">›</button>
      <div id="sidebarBody" class="sidebar-body">
        <div id="panels">
          <section class="acc open" data-acc>
            <h2 class="acc-head">Maturity</h2>
            <div class="acc-body">
              <div class="bar"><div id="maturityBar"></div></div>
              <div id="maturityBreakdown" class="stats"></div>
            </div>
          </section>
          <section class="acc open" data-acc>
            <h2 class="acc-head">Glossary</h2>
            <div class="acc-body"><table id="glossary"></table></div>
          </section>
          <section class="acc" data-acc>
            <h2 class="acc-head">Decisions (ADR)</h2>
            <div class="acc-body"><table id="adrs"></table></div>
          </section>
        </div>
        <div class="detail" id="detail" hidden></div>
      </div>
    </aside>
  </div>
  <script type="module" src="/kartograph.js"></script>
</body>
</html>
